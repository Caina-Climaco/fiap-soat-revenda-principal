# Servico principal. O numero de replicas e controlado pelo HPA (2..5): o campo replicas e
# omitido para o `kubectl apply` nao brigar com ele. Cada replica roda o relay da outbox;
# as replicas dividem o trabalho com FOR UPDATE SKIP LOCKED (ADR-003).
# Contrato com o CD: container "api" (kubectl set image deployment/revenda-principal api=...).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: revenda-principal
  labels:
    app: revenda-principal
    app.kubernetes.io/name: revenda-principal
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: revenda-veiculos
spec:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: revenda-principal
  template:
    metadata:
      # Descoberta por anotacao (kubernetes_sd_configs do Prometheus). /metrics nao tem rota
      # no Kong e a NetworkPolicy so deixa o Prometheus, o Kong e o servico de venda entrarem.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        # "app" e o rotulo usado pelas NetworkPolicies (infra/terraform/network_policies.tf)
        app: revenda-principal
        app.kubernetes.io/name: revenda-principal
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: revenda-veiculos
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: revenda-principal:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: revenda-principal-config
            # DB_USER, DB_PASSWORD, DB_NAME
            - secretRef:
                name: principal-db-credentials
            # WEBHOOK_SECRET
            - secretRef:
                name: principal-webhook
            # TOKEN_SERVICO_ENTRADA (venda -> principal), TOKEN_SERVICO_SAIDA (principal -> venda)
            - secretRef:
                name: principal-tokens-servico
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

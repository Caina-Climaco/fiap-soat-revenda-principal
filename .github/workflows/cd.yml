# Entrega continua do servico principal e da plataforma comum (ADR-006).
# Roda SOMENTE no runner self-hosted deste repositorio, um container Linux no Docker
# Desktop do PC do autor (infra/runner; labels self-hosted, Linux, kind-local), e SOMENTE
# em push na main (PR mergeado) ou disparo manual. Nenhum workflow self-hosted reage a
# pull_request. O container esta na rede docker "kind": fala com o cluster pelo nome do no
# (revenda-control-plane), com o Docker do host pelo socket montado e grava o state do
# Terraform em /revenda-state/revenda-principal.tfstate (bind mount de %USERPROFILE%\.revenda,
# o mesmo arquivo usado pelo scripts/windows/04-subir-ambiente.ps1).
# O servico de venda e implantado por OUTRO repositorio (fiap-soat-revenda-vendas). Se ele
# ja estiver no cluster, o e2e deste CD tambem cobre a integracao entre os dois servicos.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "SHA (ou branch/tag) a implantar. Vazio = commit atual da main. Use para rollback (docs/08-ci-cd.md)."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-local
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: deploy
    runs-on: [self-hosted, Linux, kind-local]
    environment: local
    timeout-minutes: 60
    env:
      KIND_CLUSTER: revenda
      NS_APP: principal
      NS_VENDAS: vendas
      APP: revenda-principal
      # NodePorts pelo nome do no na rede "kind" (localhost:* sao portas do host Windows).
      # 30080 = API Gateway (Kong); os servicos sao ClusterIP e so o Kong chega neles.
      E2E_GATEWAY_URL: http://revenda-control-plane:30080
      E2E_JAEGER_URL: http://revenda-control-plane:30686
      PROMETHEUS_URL: http://revenda-control-plane:30900
      GRAFANA_URL: http://revenda-control-plane:30300
      STATE_DIR: /revenda-state
      TF_DATA_DIR: /home/runner/persist/terraform-data
      STATE_FILE: revenda-principal.tfstate
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          clean: true
          persist-credentials: false
          # Historico completo: a validacao abaixo precisa da ancestralidade ate a main.
          fetch-depth: 0

      # Disparo manual so implanta commits que ja estao na main (revisados por PR e com CI
      # verde). Vale para qualquer workflow_dispatch: com `ref` informado ou vazio, ja que
      # o disparo manual tambem pode ser feito "a partir de" outra branch.
      - name: Valida que o commit pertence a main (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REF_SOLICITADA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::O commit ${SHA} (ref solicitada: '${REF_SOLICITADA:-}', branch do disparo: '${GITHUB_REF_NAME}') nao pertence ao historico da main. O CD so implanta commits ja mergeados na main."
            exit 1
          fi
          echo "OK: ${SHA} pertence ao historico da main."
          # Commits anteriores a infraestrutura nao tem o que implantar
          if [ ! -f infra/terraform/versions.tf ] || [ ! -f Dockerfile ]; then
            echo "::error::O commit ${SHA} e anterior a infraestrutura (sem infra/terraform ou Dockerfile) e nao pode ser implantado por este CD."
            exit 1
          fi

      - name: Contexto (SHA, diretorios, kubeconfig)
        env:
          REF_SOLICITADA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          WORK_TMP="${RUNNER_TEMP}/revenda-cd"
          KCFG="${HOME}/.kube/config"
          mkdir -p "$WORK_TMP" "$TF_DATA_DIR" "$(dirname "$KCFG")"
          if [ ! -d "$STATE_DIR" ] || [ ! -w "$STATE_DIR" ]; then
            echo "::error::${STATE_DIR} ausente ou sem escrita: o container do runner precisa do bind mount de %USERPROFILE%\\.revenda (scripts/windows/03-instalar-runner.ps1)"
            exit 1
          fi
          {
            echo "SHA=${SHA}"
            echo "IMAGEM=${APP}:${SHA}"
            echo "KUBECONFIG=${KCFG}"
            echo "TF_VAR_kubeconfig_path=${KCFG}"
            echo "WORK_TMP=${WORK_TMP}"
          } >> "$GITHUB_ENV"
          echo "Implantando ${SHA} (evento: ${GITHUB_EVENT_NAME}, ref solicitada: '${REF_SOLICITADA:-}')"
          for ferramenta in docker kind kubectl terraform python3 curl jq base64 sed; do
            command -v "$ferramenta" >/dev/null 2>&1 || { echo "::error::Ferramenta ausente no PATH do runner: $ferramenta"; exit 1; }
          done
          docker version --format 'docker {{.Server.Version}}'
          kind version
          kubectl version --client
          terraform version

      # O cluster e criado pela CLI kind, nao pelo Terraform: o provider tehcyx/kind nao
      # tem assinatura de codigo e e bloqueado pelo Smart App Control do Windows 11 (ADR-006).
      - name: Cluster kind (cria se nao existir)
        run: |
          set -euo pipefail
          existe() {
            kind get clusters 2>/dev/null | grep -qx "$KIND_CLUSTER" \
              && [ "$(docker inspect -f '{{.State.Running}}' "${KIND_CLUSTER}-control-plane" 2>/dev/null)" = "true" ]
          }
          # Exclusao mutua entre os CDs dos dois repositorios (o cluster e compartilhado):
          # `docker network create` e atomico e falha se a rede ja existir. Sem isso, um
          # `kind create` que perde a corrida apaga, ao falhar, o no que o outro criou.
          TRAVA=revenda-kind-criando
          if existe; then
            echo "Cluster kind '$KIND_CLUSTER' ja existe."
          elif docker network create "$TRAVA" >/dev/null 2>&1; then
            trap 'docker network rm "$TRAVA" >/dev/null 2>&1 || true' EXIT
            if existe; then
              echo "Cluster kind '$KIND_CLUSTER' ja existe."
            else
              kind create cluster --config infra/kind/cluster.yaml --wait 120s
            fi
          else
            echo "O CD do outro repositorio esta criando o cluster; aguardando (ate 6 min)..."
            for _ in $(seq 1 72); do
              if existe && ! docker network inspect "$TRAVA" >/dev/null 2>&1; then break; fi
              sleep 5
            done
            existe || { echo "::error::Cluster '$KIND_CLUSTER' nao ficou pronto. Se nenhum CD estiver rodando, remova a trava: docker network rm $TRAVA"; exit 1; }
          fi
          # Um cluster "revenda" de fase anterior nao publica o Jaeger (30686 -> 16686) e
          # carrega namespaces de outro Terraform: recriar e decisao do autor, nao do CD.
          if [ -z "$(docker port "${KIND_CLUSTER}-control-plane" 30686/tcp 2>/dev/null)" ]; then
            echo "::error::O cluster '${KIND_CLUSTER}' e de uma fase anterior (sem a porta 30686 do Jaeger). No PC: scripts/windows/04-subir-ambiente.ps1 -RecriarCluster"
            exit 1
          fi
          kind export kubeconfig --internal --name "$KIND_CLUSTER"
          kubectl config current-context
          kubectl get nodes -o wide

      - name: Terraform (principal, Kong, Prometheus, Grafana, Collector, Jaeger, metrics-server)
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          # Mesmo state do Windows (/revenda-state); TF_DATA_DIR proprio (providers linux).
          # -reconfigure: o caminho do state e fixo e vem sempre por -backend-config.
          terraform init -input=false -reconfigure -backend-config="path=${STATE_DIR}/${STATE_FILE}"
          terraform apply -input=false -auto-approve

      - name: Build da imagem ${{ env.IMAGEM }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGEM" >/dev/null 2>&1; then
            echo "Imagem $IMAGEM ja existe no Docker local (reimplantacao/rollback): build reaproveitado."
          else
            docker build --label "org.opencontainers.image.revision=${SHA}" -t "$IMAGEM" .
          fi

      - name: Carga da imagem no kind
        run: kind load docker-image "$IMAGEM" --name "$KIND_CLUSTER"

      - name: Migracao do banco (Job principal-migracao)
        run: |
          set -euo pipefail
          kubectl -n "$NS_APP" delete job principal-migracao --ignore-not-found --wait=true
          manifesto="${WORK_TMP}/migracao.yaml"
          kubectl kustomize k8s/migracao > "$manifesto"
          # Troca a imagem neutra (tag dev ou sem tag) pela tag do SHA
          sed -E -i "s#^([[:space:]]*-?[[:space:]]*image:[[:space:]]*[\"']?)${APP}(:[A-Za-z0-9._-]+)?([\"']?)[[:space:]]*\$#\1${APP}:${SHA}\3#" "$manifesto"
          grep -q "${APP}:${SHA}" "$manifesto" || { echo "::error::Imagem ${APP} nao encontrada no manifesto renderizado de k8s/migracao"; exit 1; }
          kubectl apply -n "$NS_APP" -f "$manifesto"
          echo "Aguardando o Job (ate 300 s)..."
          # Duas esperas em paralelo: `complete` (sucesso) e `failed` (backoffLimit esgotado),
          # para falhar logo em vez de esperar o timeout. A decisao final vem do status do Job.
          kubectl -n "$NS_APP" wait --for=condition=complete --timeout=300s job/principal-migracao &
          espera_ok=$!
          kubectl -n "$NS_APP" wait --for=condition=failed --timeout=300s job/principal-migracao >/dev/null 2>&1 &
          espera_falha=$!
          wait -n "$espera_ok" "$espera_falha" || true
          kill "$espera_ok" "$espera_falha" 2>/dev/null || true
          concluidos="$(kubectl -n "$NS_APP" get job principal-migracao -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
          if [ "${concluidos:-0}" -lt 1 ]; then
            echo "::error::Migracao nao concluiu (Job principal-migracao sem sucesso). Deployment NAO foi alterado."
            kubectl -n "$NS_APP" describe job principal-migracao || true
            kubectl -n "$NS_APP" logs job/principal-migracao --all-containers --tail=200 || true
            exit 1
          fi
          kubectl -n "$NS_APP" logs job/principal-migracao --all-containers --tail=50 || true

      - name: Deploy do revenda-principal (k8s/base)
        run: |
          set -euo pipefail
          # Renderiza a base, troca a imagem neutra pela tag do SHA e aplica de uma vez.
          # (Aplicar a base com a tag dev e so depois usar `set image` criaria um
          # ReplicaSet intermediario com imagem inexistente e quebraria o `rollout undo`.)
          manifesto="${WORK_TMP}/base.yaml"
          kubectl kustomize k8s/base > "$manifesto"
          sed -E -i "s#^([[:space:]]*-?[[:space:]]*image:[[:space:]]*[\"']?)${APP}(:[A-Za-z0-9._-]+)?([\"']?)[[:space:]]*\$#\1${APP}:${SHA}\3#" "$manifesto"
          grep -q "${APP}:${SHA}" "$manifesto" || { echo "::error::Imagem ${APP} nao encontrada no manifesto renderizado de k8s/base"; exit 1; }
          kubectl apply -f "$manifesto"
          # Garantia idempotente (sem efeito se o apply ja definiu a mesma imagem); container `api` e contrato.
          kubectl -n "$NS_APP" set image deployment/${APP} "api=${IMAGEM}"
          kubectl -n "$NS_APP" annotate deployment/${APP} kubernetes.io/change-cause="CD ${SHA}" --overwrite
          if ! kubectl -n "$NS_APP" rollout status deployment/${APP} --timeout=180s; then
            echo "::error::Rollout nao concluiu em 180 s"
            kubectl -n "$NS_APP" get pods -o wide || true
            kubectl -n "$NS_APP" describe deployment ${APP} || true
            kubectl -n "$NS_APP" logs deployment/${APP} --all-containers --tail=100 || true
            exit 1
          fi
          atual="$(kubectl -n "$NS_APP" get deployment ${APP} -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].image}')"
          [ "$atual" = "$IMAGEM" ] || { echo "::error::Deployment com imagem inesperada: '$atual' (esperada: $IMAGEM)"; exit 1; }
          kubectl -n "$NS_APP" get deployment,pods,svc,hpa -o wide

      # Os servicos nao tem rota de saude no Kong: a prontidao vem do rollout acima; aqui se
      # confere o caminho publico ate o principal (Kong -> Service -> pod).
      - name: Principal alcancavel pelo Kong
        run: |
          set -euo pipefail
          url="${E2E_GATEWAY_URL}/principal/openapi.json"
          for _ in $(seq 1 36); do
            if curl -fsS -o /dev/null --max-time 5 "$url"; then echo "OK: $url"; exit 0; fi
            sleep 5
          done
          echo "::error::Sem resposta 2xx de $url em 180 s"
          exit 1

      # O monitoramento enxerga o principal e o gateway, os paineis e alertas foram
      # provisionados e o caminho dos traces (Collector -> Jaeger) esta de pe (ADR-007).
      - name: Observabilidade (Prometheus, Grafana, Collector e Jaeger)
        run: |
          set -euo pipefail
          consulta() {
            curl -fsS --max-time 5 --get "${PROMETHEUS_URL}/api/v1/query" --data-urlencode "query=$1" \
              | jq -r '.data.result[0].value[1] // "0"'
          }
          for job in "$APP" kong; do
            for _ in $(seq 1 24); do
              alvos="$(consulta "count(up{job=\"${job}\"} == 1)" || echo 0)"
              [ "${alvos:-0}" != "0" ] && break
              sleep 5
            done
            [ "${alvos:-0}" != "0" ] || { echo "::error::Prometheus sem alvos ativos do job ${job}"; exit 1; }
            echo "OK: Prometheus coleta ${alvos} alvo(s) do job ${job}"
          done
          grupos="$(curl -fsS --max-time 5 "${PROMETHEUS_URL}/api/v1/rules" | jq '.data.groups | length')"
          [ "$grupos" -ge 3 ] || { echo "::error::Regras de alerta nao carregadas (${grupos} grupos)"; exit 1; }
          echo "OK: ${grupos} grupos de regras de alerta carregados"
          curl -fsS --max-time 5 "${GRAFANA_URL}/api/health" >/dev/null
          for uid in revenda-visao-geral revenda-saga; do
            titulo="$(curl -fsS --max-time 5 "${GRAFANA_URL}/api/dashboards/uid/${uid}" | jq -r '.dashboard.title')"
            echo "OK: Grafana com o painel '${titulo}'"
          done
          # O painel so serve se o Grafana consulta o Prometheus (como Viewer anonimo)
          corpo='{"queries":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},"expr":"count(up == 1)","instant":true}],"from":"now-5m","to":"now"}'
          for _ in $(seq 1 24); do
            resposta="$(curl -sS --max-time 10 -H 'Content-Type: application/json' -d "$corpo" "${GRAFANA_URL}/api/ds/query" || true)"
            valor="$(printf '%s' "$resposta" | jq -r '.results.A.frames[0].data.values[1][0] // empty' 2>/dev/null || true)"
            [ -n "$valor" ] && [ "$valor" != "0" ] && break
            sleep 5
          done
          if [ -z "${valor:-}" ] || [ "$valor" = "0" ]; then
            echo "::error::Grafana nao consulta o Prometheus: ${resposta:0:300}"
            exit 1
          fi
          echo "OK: Grafana consulta o Prometheus (${valor} alvos up)"
          kubectl -n observabilidade rollout status deployment/otel-collector --timeout=60s
          # Jaeger v2: API de consulta /api/v3 (a interna /api/services pode nao existir)
          servicos="$(curl -fsS --max-time 5 "${E2E_JAEGER_URL}/api/v3/services" || curl -fsS --max-time 5 "${E2E_JAEGER_URL}/api/services")"
          echo "OK: Collector no ar e Jaeger responde: ${servicos:0:200}"

      # Contrato com o outro repositorio: o e2e de integracao so roda com o servico de venda
      # no ar. Sem ele, o CD deste repositorio continua valido (ordem do ADR-006).
      - name: Servico de venda implantado?
        run: |
          set -euo pipefail
          prontos="$(kubectl -n "$NS_VENDAS" get deployment revenda-vendas -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)"
          if [ "${prontos:-0}" -ge 1 ] 2>/dev/null; then
            echo "E2E_VENDAS=1" >> "$GITHUB_ENV"
            echo "Servico de venda no ar (${prontos} replica(s)): e2e de integracao habilitado."
          else
            echo "E2E_VENDAS=0" >> "$GITHUB_ENV"
            echo "::notice::Servico de venda ainda nao implantado: e2e de integracao pulado (rode o CD de fiap-soat-revenda-vendas)."
          fi

      - name: Python 3.12 para o e2e
        # python3 da imagem do runner (Ubuntu 24.04); sem actions/setup-python
        run: |
          set -euo pipefail
          python3 --version
          python3 -c 'import sys; assert sys.version_info[:2] >= (3, 12), sys.version'

      - name: Dependencias do e2e (pytest + httpx, isoladas do pacote principal)
        run: |
          set -euo pipefail
          python3 -m venv "${WORK_TMP}/e2e-venv"
          VENV_PY="${WORK_TMP}/e2e-venv/bin/python"
          "$VENV_PY" -m pip install --disable-pip-version-check --quiet -r tests/e2e/requirements.txt
          "$VENV_PY" -m pytest --version
          echo "VENV_PY=${VENV_PY}" >> "$GITHUB_ENV"

      - name: Testes ponta a ponta (pytest -m e2e)
        id: e2e
        run: |
          set -euo pipefail
          segredo() {
            # Uso: segredo <namespace> <secret> <chave>
            local valor
            valor="$(kubectl -n "$1" get secret "$2" -o jsonpath="{.data.$3}" | base64 -d)"
            if [ -z "$valor" ]; then echo "::error::Secret $1/$2 sem a chave $3" >&2; return 1; fi
            printf '%s' "$valor"
          }
          E2E_GESTOR_APIKEY="$(segredo gateway consumidores-kong GESTOR_APIKEY)"
          echo "::add-mask::${E2E_GESTOR_APIKEY}"
          E2E_GATEWAY_PAGAMENTO_APIKEY="$(segredo gateway consumidores-kong GATEWAY_PAGAMENTO_APIKEY)"
          echo "::add-mask::${E2E_GATEWAY_PAGAMENTO_APIKEY}"
          E2E_WEBHOOK_SECRET="$(segredo "$NS_APP" principal-webhook WEBHOOK_SECRET)"
          echo "::add-mask::${E2E_WEBHOOK_SECRET}"
          export E2E_GESTOR_APIKEY E2E_GATEWAY_PAGAMENTO_APIKEY E2E_WEBHOOK_SECRET E2E_VENDAS
          # No CD a ausencia de variaveis e erro (nunca skip silencioso).
          export E2E_EXIGIR=1
          # tests/e2e/pytest.ini isola a configuracao do pyproject (addopts -m "not e2e").
          "$VENV_PY" -m pytest tests/e2e -m e2e -p no:cacheprovider -o addopts="" \
            -v -rA --junitxml="${WORK_TMP}/e2e-junit.xml"

      - name: Diagnostico em falha
        if: ${{ failure() }}
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n "$NS_APP" get events --sort-by=.lastTimestamp | tail -n 40 || true
          kubectl -n "$NS_APP" logs deployment/${APP} --all-containers --tail=200 || true
          kubectl -n gateway logs deployment/kong --tail=80 || true
          kubectl -n observabilidade get pods -o wide || true
          kubectl -n observabilidade logs deployment/otel-collector --tail=40 || true
          echo "Rollback: Actions > CD > Run workflow com ref=<sha-anterior>, ou 'kubectl -n principal rollout undo deployment/revenda-principal' (docs/08-ci-cd.md)."

      - name: Resumo da implantacao
        if: ${{ always() }}
        run: |
          {
            echo "## Deploy local (kind \`${KIND_CLUSTER}\`)"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${SHA:-?}\` |"
            echo "| Imagem | \`${IMAGEM:-?}\` |"
            echo "| Evento | ${GITHUB_EVENT_NAME} |"
            pronto="$(kubectl -n "$NS_APP" get deployment ${APP} -o jsonpath='{.status.readyReplicas}/{.status.replicas}' 2>/dev/null || echo '?')"
            echo "| Replicas prontas | ${pronto} |"
            echo "| Resultado do e2e | ${{ steps.e2e.outcome || 'nao executado' }} |"
            if [ -f "${WORK_TMP:-/nonexistent}/e2e-junit.xml" ]; then
              linha="$(grep -o '<testsuite [^>]*>' "${WORK_TMP}/e2e-junit.xml" | head -n 1)"
              attr() { printf '%s' "$linha" | sed -n "s/.* $1=\"\([^\"]*\)\".*/\1/p"; }
              echo "| Testes e2e | $(attr tests) total, $(attr failures) falhas, $(attr errors) erros, $(attr skipped) pulados |"
            fi
            echo "| Integracao com o servico de venda | $([ "${E2E_VENDAS:-0}" = 1 ] && echo 'testada' || echo 'servico de venda ausente') |"
            echo "| Kong (no PC) | http://localhost:8080 (Swagger em /principal/docs) |"
            echo "| Grafana / Prometheus / Jaeger (no PC) | http://localhost:3000 / http://localhost:9090 / http://localhost:16686 |"
            echo "| Testado pelo runner em | ${E2E_GATEWAY_URL} (rede kind) |"
            echo ""
            echo "Rollback: Actions > CD > Run workflow com \`ref\` = SHA anterior (docs/08-ci-cd.md)."
          } >> "$GITHUB_STEP_SUMMARY"
